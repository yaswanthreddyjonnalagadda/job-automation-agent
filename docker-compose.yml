services:
  postgres:
    image: postgres:16-alpine
    container_name: jobagent_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-jobagent}
      POSTGRES_USER: ${DB_USER:-agent}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agent_secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    container_name: jobagent_redis
    restart: always
    ports:
      - "6379:6379"

  poller:
    build:
      context: .
      dockerfile: services/poller/Dockerfile
    container_name: jobagent_poller
    depends_on:
      - postgres
      - redis
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-agent}:${DB_PASSWORD:-agent_secret}@postgres:5432/${DB_NAME:-jobagent}
      REDIS_URL: redis://redis:6379/0

  matcher:
    build:
      context: .
      dockerfile: services/matcher/Dockerfile
    container_name: jobagent_matcher
    depends_on:
      - postgres
      - redis
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-agent}:${DB_PASSWORD:-agent_secret}@postgres:5432/${DB_NAME:-jobagent}
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - ./storage:/app/storage

  applicator:
    build:
      context: .
      dockerfile: services/applicator/Dockerfile
    container_name: jobagent_applicator
    depends_on:
      - postgres
      - redis
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-agent}:${DB_PASSWORD:-agent_secret}@postgres:5432/${DB_NAME:-jobagent}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./storage:/app/storage

volumes:
  pgdata:
