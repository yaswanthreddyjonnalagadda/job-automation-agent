# The test suite on every pull request and every push to main (RFC-001, M0).
# A pull request can be merged only when this passes (branch protection:
# Settings -> Branches -> main -> "Require status checks to pass" -> "tests").
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: job_agent
      POSTGRES_USER: job_agent
      POSTGRES_PASSWORD: ci-only
    steps:
      - uses: actions/checkout@v4

      # tests/test_dashboard.py talks to the tracker's Postgres database. It is the PostgreSQL 16 that ships on the
      # runner, started here: a service container had to pull its image from a registry, and every registry we
      # tried (Docker Hub, then AWS ECR Public) turned the shared runners away with "toomanyrequests: Data limit
      # exceeded", failing the job at "Initialize containers" before a single test ran. The password is not a secret.
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE job_agent LOGIN SUPERUSER PASSWORD 'ci-only';"
          sudo -u postgres createdb -O job_agent job_agent
          for _ in $(seq 1 30); do pg_isready -h 127.0.0.1 -p 5432 -U job_agent && break; sleep 1; done
          PGPASSWORD=ci-only psql -h 127.0.0.1 -U job_agent -d job_agent -c "select version();"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Place data matches its source
        run: python reference/build_geo.py --check

      - name: Tests
        run: python -m pytest -q -rs -n auto
